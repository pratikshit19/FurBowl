  <ellipse cx="59" cy="20" rx="8.5" ry="13" transform="rotate(6 59 20)" fill="#ffffff" />
  <ellipse cx="77" cy="30" rx="7.5" ry="11" transform="rotate(22 77 30)" fill="#ffffff" />
  
